# Per-function verify_jwt pins for every edge function invoked by a pg_cron
# job. This file didn't exist before 2026-11-11 -- every function's verify_jwt
# setting lived only as live state on the project, set ad hoc at whatever
# value the last deploy tool happened to default to. That silence caused two
# confirmed incidents found the same day: fetch-macro-data and
# update-regime-portfolio-targets both have verify_jwt=true but their cron
# jobs send no Authorization header, so every scheduled run 401'd (since
# ~Oct 30 for the regime-targets job) while pg_cron itself still reported
# "succeeded" (it only confirms the HTTP request was queued, not that the
# function accepted it). A deploy tool that doesn't explicitly pass
# verify_jwt (the Supabase MCP tool defaults it to true) can silently flip a
# false-pinned function back to true on its next redeploy and reintroduce
# this exact failure mode -- this file is the checked-in guard against that.
#
# Convention: verify_jwt=true means the matching cron.job command must
# include an Authorization: Bearer <anon-key> header (see any of the
# true-pinned jobs below for the pattern); verify_jwt=false means the
# function implements its own gating (or needs none) and the cron can POST
# with no auth header at all.

[functions.sync-market-data]
verify_jwt = false

[functions.fetch-macro-data]
verify_jwt = true

[functions.refresh-asset-returns]
verify_jwt = false

[functions.fetch-cofer-data]
verify_jwt = false

